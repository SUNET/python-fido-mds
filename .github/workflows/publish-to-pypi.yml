name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  schedule:
    - cron: '0 2 15 * *'  # Run at 02:00 UTC on the 15th of every month
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.set-version.outputs.VERSION}}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0  # Fetch all history for proper versioning

    - name: Set version for scheduled release
      id: set-version
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        # Create version string: YYYY.MM (e.g., 2025.10)
        VERSION=$(date -u +"%Y.%-m")
        echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Creating version: ${VERSION}"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build and uv
      # Everything is installed from hash-locked requirements and as wheels only, so no unlocked version is
      # resolved and no setup script runs. To update them, see .github/requirements/README.md.
      run: |
        python3 -m pip install --user --require-hashes --only-binary :all: -r .github/requirements/requirements-bootstrap.txt
        uv venv
        uv pip install --require-hashes --only-binary :all: -r .github/requirements/requirements-release.txt
    - name: Update FIDO metadata and root certs
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      env:
        # the Makefile runs the update script with `uv run`, which must not install anything that is not locked
        UV_NO_SYNC: "1"
      run: make update_package_data
    - name: Test the package with the new metadata
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      # The FIDO Alliance changes the metadata every month, and the tests load all of it. Without this step a
      # release that cannot load its own data gets published (as happened with 2026.10).
      run: PYTHONPATH=src .venv/bin/python -m pytest src
    - name: Build a binary wheel and a source tarball
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: make build
    - name: Store the distribution packages
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: github.event_name == 'schedule'  # publish on schedule
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fido-mds
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    if: github.event_name == 'schedule'
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VERSION: ${{needs.build.outputs.version}}
      run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "${{ github.sha }}" --notes ""
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VERSION: ${{needs.build.outputs.version}}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: gh release upload "$VERSION" dist/** --repo "$GITHUB_REPOSITORY"

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/fido-mds

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
